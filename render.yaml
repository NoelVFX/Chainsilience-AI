# Render blueprint — one-click backend + managed Postgres.
# In Render: New → Blueprint → point at this repo. Render reads this file.
# After it deploys, copy the backend URL and set it as NEXT_PUBLIC_API_BASE_URL
# on Vercel (see DEPLOYMENT.md), then update CORS_ORIGINS below with your
# Vercel domain and redeploy.

databases:
  - name: chainsight-db
    plan: free

services:
  - type: web
    name: chainsight-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: chainsight-db
          property: connectionString
      # Must match the frontend's real Vercel domain(s) exactly (scheme + host).
      - key: CORS_ORIGINS
        value: '["https://chainsilience-ai.vercel.app"]'
      # Base URL used to build the password-reset link in emails — must be the
      # frontend's real domain, not localhost.
      - key: FRONTEND_BASE_URL
        value: "https://chainsilience-ai.vercel.app"
      # Optional: enable live LLM calls.
      # - key: OPENAI_API_KEY
      #   sync: false
      # Optional: send real sign-up verification emails. Without these the 6-digit
      # code is shown on-screen (dev hint) since ENVIRONMENT defaults to
      # development. Set all three (values hidden) to email codes instead.
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false