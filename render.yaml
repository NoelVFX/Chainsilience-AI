# Render blueprint — one-click backend + managed Postgres.
# In Render: New → Blueprint → point at this repo. Render reads this file.
# After it deploys, copy the backend URL and set it as NEXT_PUBLIC_API_BASE_URL
# on Vercel (see DEPLOYMENT.md), then update CORS_ORIGINS below with your
# Vercel domain and redeploy.

databases:
  - name: chainsight-db
    plan: free

services:
  - type: web
    name: chainsight-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: chainsight-db
          property: connectionString
      # Replace with your real Vercel domain(s) once the frontend is deployed.
      - key: CORS_ORIGINS
        value: '["https://chainsight-ai.vercel.app"]'
      # Optional: enable live LLM calls.
      # - key: OPENAI_API_KEY
      #   sync: false
